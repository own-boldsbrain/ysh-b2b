<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DynamoDB Browser Integration — YSH</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; padding: 18px; background:#f7f7fb; }
    .container { max-width:1100px; margin:0 auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06);} 
    label{font-weight:600}
    input, button, select { padding:8px 10px; margin:6px 0; border:1px solid #d0d7de; border-radius:6px; }
    .flex {display:flex; gap:10px; align-items:center}
    .results { margin-top:14px }
    .sku { padding:10px; border-radius:6px; border:1px solid #e6eef7; margin-bottom:8px; background:#fbfdff }
    .missing { color:#b45309; font-weight:700 }
    .ok { color:#065f46 }
    pre { white-space:pre-wrap; word-wrap:break-word }
  </style>
</head>
<body>
  <div class="container">
    <h2>DynamoDB direto do Browser (Leitura somente)</h2>
    <p>Ideal para debugging / dashboards internas. Use Cognito Identity Pool com roles <strong>ReadOnly</strong>.</p>

    <div>
      <label for="region">Região AWS</label>
      <input id="region" placeholder="ex: us-east-1" value="us-east-1" />
    </div>

    <div>
      <label for="identityPoolId">Cognito Identity Pool ID</label>
      <input id="identityPoolId" placeholder="ex: us-east-1:xxxxxxx-xxxx-xxxx-xxxx-xxxxxxxx" />
    </div>

    <div>
      <label for="tableName">DynamoDB Table</label>
      <input id="tableName" placeholder="ysh-products-catalog" value="ysh-products-catalog" />
    </div>

    <div class="flex">
      <button id="btnScan">Scan (até 100)</button>
      <button id="btnGetSample">Buscar SKU por chave (ex.: FOTUSKP...)</button>
      <input id="keyInput" placeholder="Informe a chave primaria do SKU" style="flex:1" />
      <select id="limitSelect">
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100" selected>100</option>
      </select>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
