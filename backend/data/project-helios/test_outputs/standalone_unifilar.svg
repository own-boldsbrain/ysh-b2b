<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <!-- Title -->
    <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
        Diagrama Unifilar - Sistema Fotovoltaico
    </text>

    <!-- Solar Panels -->
    <g id="panels">
        <text x="50" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Painéis Solares</text>

        <rect x="30" y="100" width="60" height="30" fill="#FFD700" stroke="#000" stroke-width="1"/>
        <text x="60" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">
            String 1
        </text>
        <text x="120" y="115" font-family="Arial, sans-serif" font-size="9">
            8 módulos
        </text>
        <text x="120" y="125" font-family="Arial, sans-serif" font-size="9">
            2280W
        </text>

        <rect x="30" y="150" width="60" height="30" fill="#FFD700" stroke="#000" stroke-width="1"/>
        <text x="60" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">
            String 2
        </text>
        <text x="120" y="165" font-family="Arial, sans-serif" font-size="9">
            8 módulos
        </text>
        <text x="120" y="175" font-family="Arial, sans-serif" font-size="9">
            2280W
        </text>

        <rect x="30" y="200" width="60" height="30" fill="#FFD700" stroke="#000" stroke-width="1"/>
        <text x="60" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">
            String 3
        </text>
        <text x="120" y="215" font-family="Arial, sans-serif" font-size="9">
            8 módulos
        </text>
        <text x="120" y="225" font-family="Arial, sans-serif" font-size="9">
            2280W
        </text>

    </g>

    <!-- Inverters -->
    <g id="inverters">
        <text x="300" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Inversores</text>

        <rect x="280" y="100" width="80" height="35" fill="#87CEEB" stroke="#000" stroke-width="1"/>
        <text x="320" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">
            INV 1
        </text>
        <text x="320" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">
            5000W
        </text>

    </g>

    <!-- String Boxes -->
    <g id="string-boxes">
        <text x="450" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Caixas de String</text>

        <rect x="430" y="100" width="70" height="30" fill="#FFA500" stroke="#000" stroke-width="1"/>
        <text x="465" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">
            SB 1
        </text>
        <text x="465" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="8">
            1000V
        </text>

    </g>

    <!-- Connections -->
    <g id="connections" stroke="#000" stroke-width="2" fill="none">
        <!-- Panel to String Box -->
        <line x1="90" y1="115" x2="430" y2="115"/>
        <polygon points="425,112 435,115 425,118" fill="#000"/>

        <!-- String Box to Inverter -->
        <line x1="500" y1="115" x2="280" y2="115"/>
        <polygon points="285,112 275,115 285,118" fill="#000"/>
    </g>

    <!-- Grid Connection -->
    <g id="grid">
        <text x="600" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Rede Elétrica</text>
        <circle cx="650" cy="115" r="20" fill="#FF6B6B" stroke="#000" stroke-width="1"/>
        <text x="650" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">⚡</text>
        <line x1="360" y1="115" x2="630" y2="115" stroke="#000" stroke-width="2"/>
        <polygon points="635,112 625,115 635,118" fill="#000"/>
    </g>

    <!-- Technical Specs -->
    <g id="specs">
        <rect x="50" y="450" width="700" height="120" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1" rx="5"/>
        <text x="60" y="470" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Especificações Técnicas:</text>
        <text x="60" y="485" font-family="Arial, sans-serif" font-size="9">• Potência Total: 8.0 kWp</text>
        <text x="60" y="500" font-family="Arial, sans-serif" font-size="9">• Número de Strings: 3</text>
        <text x="60" y="515" font-family="Arial, sans-serif" font-size="9">• Módulos Totais: 24</text>
        <text x="400" y="485" font-family="Arial, sans-serif" font-size="9">• Tensão Sistema: 1000V</text>
        <text x="400" y="500" font-family="Arial, sans-serif" font-size="9">• Frequência: 60Hz</text>
        <text x="400" y="515" font-family="Arial, sans-serif" font-size="9">• Tipo de Conexão: Trifásica</text>
    </g>
</svg>