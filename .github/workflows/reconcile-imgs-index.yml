name: Reconcile imgs-index and ensure SKU images

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch:
    inputs:
      do_upload:
        description: 'Upload to DynamoDB after reconciliation'
        required: false
        default: 'false'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run ensure-sku-images
        working-directory: backend
        run: |
          node ./scripts/ensure-sku-images.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/enriched-skus-for-dynamodb-images-fixed.json backend/ENRICHED_SKUS_DYNAMIC_PRICING_REPORT-images-fixed.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update SKU images [skip ci]"
            git push
          fi

      - name: Optionally upload to DynamoDB
        if: github.event.inputs.do_upload == 'true' || env.DO_UPLOAD == 'true'
        working-directory: backend
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DYNAMODB_TABLE_NAME: ysh-products-catalog
        run: |
          node ./scripts/upload-enriched-skus-to-dynamodb.js --file enriched-skus-for-dynamodb-images-fixed.json
